# jjh7757/TIL — AWS배포환경/templates/deploy.yml 기반. APP_NAME 만 바꾸고, 앞에 test(Postgres 서비스로 pytest · 프론트 빌드) 를 붙였다.
name: deploy

on:
  push:
    branches: [master]
    paths-ignore:          # 문서만 바뀌면 빌드·배포 안 함
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# OIDC로 임시 자격증명을 받기 위해 필요. 장기 액세스 키를 만들지 않는 핵심.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  APP_NAME: mahjong-records        # ECR 리포지토리 이름 = 서버의 /srv/<이름> = 컨테이너 이름
  INSTANCE_ID: i-05ee0665bbba15a52

# 동시에 두 번 배포되지 않도록 (앞선 실행은 취소)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI: 실제 Postgres 에 대고 pytest, 프론트 타입 검사 · 빌드. 통과해야 deploy 가 돈다.
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:x@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # Dockerfile 과 같은 버전
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build     # tsc --noEmit && vite build
        working-directory: web

  deploy:
    needs: test
    # 네이티브 arm64 러너. 퍼블릭 저장소는 무료, 프라이빗은 과금된다.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403187831140:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 빌드 & ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$APP_NAME"
          docker build --platform linux/arm64 --build-arg GIT_SHA="$SHA" -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: SSM으로 배포
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $APP_NAME" \
            --parameters "commands=[\"/usr/local/bin/deploy-app $APP_NAME $SHA\"]" \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          # send-command 직후엔 invocation이 아직 없을 수 있어 잠깐 기다린다
          sleep 5
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "---------------------"

          # 이 체크가 없으면 서버에서 실패해도 워크플로가 초록색으로 뜬다
          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패: $STATUS"
            exit 1
          fi
          echo "배포 성공"
